name: reefline_sentry
version: 0.1.0
dsl_version: 3
backend: file
test_queries:
  - SELECT COUNT(*) FROM reefline_sentry.events
  - SELECT COUNT(*) FROM reefline_sentry.issues
tables:
  - name: events
    description: Individual Sentry error events (synthetic).
    format: jsonl
    source:
      location: file:///Users/khushiyantchauhan/Developer/experiments/wemakedevs-hack/spyglass/coral/data/sentry/
      glob: "events.jsonl"
    columns:
      - { name: event_id,  type: Utf8 }
      - { name: issue_id,  type: Utf8 }
      - { name: service,   type: Utf8 }
      - { name: level,     type: Utf8 }
      - { name: title,     type: Utf8 }
      - { name: message,   type: Utf8 }
      - { name: timestamp, type: Utf8 }
      - { name: release,   type: Utf8 }
      - { name: user_id,   type: Utf8 }
  - name: issues
    description: Sentry issues — grouped error fingerprints (synthetic).
    format: jsonl
    source:
      location: file:///Users/khushiyantchauhan/Developer/experiments/wemakedevs-hack/spyglass/coral/data/sentry/
      glob: "issues.jsonl"
    columns:
      - { name: id,              type: Utf8 }
      - { name: title,           type: Utf8 }
      - { name: service,         type: Utf8 }
      - { name: level,           type: Utf8 }
      - { name: first_seen,      type: Utf8 }
      - { name: last_seen,       type: Utf8 }
      - { name: events_count,    type: Int64 }
      - { name: users_affected,  type: Int64 }
